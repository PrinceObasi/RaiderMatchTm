name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc -p tsconfig.app.json --noEmit

      - name: Lint
        run: bunx eslint .

      - name: Test
        run: bun run test

      - name: Check Edge Functions
        run: |
          deno test supabase/functions/_shared
          deno test supabase/functions/validate-internship-links/validation_test.ts
          deno check supabase/functions/validate-internship-links/index.ts
          deno check supabase/functions/apply/index.ts
          deno check supabase/functions/delete-account/index.ts
          deno check supabase/functions/notify_employer/index.ts
          deno check supabase/functions/update-company-logos/index.ts
          deno test --config supabase/functions/upload-resume/deno.json supabase/functions/upload-resume/resume-parser_test.ts
          deno check --config supabase/functions/upload-resume/deno.json supabase/functions/upload-resume/index.ts

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder
